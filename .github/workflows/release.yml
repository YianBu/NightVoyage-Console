name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "NightVoyage-Console"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $exclude = @(".git", ".github", "logs", "screenshots", "profile.json", "build", "dist", "__pycache__")
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | Copy-Item -Destination $stage -Recurse -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "NightVoyage-Console-${{ github.ref_name }}.zip" -Force
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: NightVoyage-Console-${{ github.ref_name }}.zip
